name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Matrix (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 22.x, 24.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Test Suite (Unit, Canaries, 10x Hostile Stress)
        run: npm test

      - name: Run Release ZIP Provenance Court
        run: python3 tests/test_release_zip_provenance_court.py

      - name: Run Real-Browser Court (Headless Chromium)
        run: npm run test:browser

      - name: Validate Version Consistency
        run: node --test tests/unit/test_version_consistency.test.js

      - name: Strict Dependency Audit (0 Vulnerabilities)
        run: npm audit
