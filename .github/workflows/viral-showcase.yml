name: AIR10 Audio Accelerator Viral Showcase & Test Circuit
on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Validate Showcase Assets
        shell: bash
        run: |
          test -f index.html || exit 1
          test -f showcase.html || exit 1
          test -f assets/scorecard.svg || exit 1
          test -f llms.txt || exit 1
          test -f db/STRESS_BENCHMARK_REAL_WHEELS.json || exit 1
          echo "All showcase primitives verified."
      - name: Install dependencies & run unit tests
        shell: bash
        run: |
          npm ci
          npm test
      - name: Run Real-Browser Court (Headless Chromium)
        shell: bash
        run: |
          npm run test:browser
      - name: Set up Python for Cryptographic Attestation
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - name: Install Python Cryptography
        shell: bash
        run: |
          pip install cryptography
      - name: Run Standalone Audio Benchmark Reproducer
        shell: bash
        run: |
          python3 scripts/run_benchmark_with_tombstone.py \
            --repo "rajon369963-del/air10-ai-audio-accelerator" \
            --benchmark-cmd "node scripts/benchmark_audio_engine.js" \
            --expected-output "scripts/audio_benchmark_results.json" \
            --status-output "scripts/benchmark_status.json" \
            --stdout-log "scripts/benchmark_stdout.log" \
            --stderr-log "scripts/benchmark_stderr.log"

      - name: Upload Live Benchmark Artifact (Preserve Evidence Even on Failure)
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: live-audio-benchmark-results
          path: |
            scripts/audio_benchmark_results.json
            scripts/benchmark_status.json
            scripts/benchmark_stdout.log
            scripts/benchmark_stderr.log
          if-no-files-found: error
          retention-days: 90

      - name: Run Directional Lineage & Hostile Court Tests
        shell: bash
        run: |
          python3 tests/test_federation_manifest_hostile_court.py
          python3 tests/test_dsp_provenance_court.py

      - name: Run Permanent Adversarial Canary Regression Suite
        shell: bash
        run: |
          python3 tests/test_adversarial_receipt_canaries.py

      - name: Verify Cryptographic Receipt & Scorecard Zero-Drift
        shell: bash
        run: |
          set -o pipefail
          set +e
          python3 scripts/verify_receipt.py --assert-live-benchmark scripts/audio_benchmark_results.json 2>&1 | tee /tmp/audio_forensic_verification_report.txt
          verifier_rc=${PIPESTATUS[0]}
          printf '\nVERIFIER_EXIT_CODE=%s\n' "$verifier_rc" | tee -a /tmp/audio_forensic_verification_report.txt
          exit "$verifier_rc"

      - name: Verify Federation Evidence Manifest
        shell: bash
        run: |
          python3 scripts/verify_federation_manifest.py --verify federation-evidence-manifest.json --repo air10-ai-audio-accelerator --authority-context auto --live-provider

      - name: Upload Forensic Verification Report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: audio-forensic-verification-report
          path: /tmp/audio_forensic_verification_report.txt
          if-no-files-found: error
          retention-days: 90
